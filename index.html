<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10132a" />
    <meta
      name="description"
      content="Christmas Arcade Fighters V5: ten challenges, original fighters, directional combat and unlockable bosses."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>Christmas Arcade Fighters</title>
  </head>
  <body>
    <div id="app">
      <header class="masthead">
        <a class="wordmark" href="#" aria-label="Christmas Arcade Fighters home"
          >CHRISTMAS ARCADE FIGHTERS</a
        >
        <div class="header-right">
          <button id="sound-toggle" class="icon-btn" aria-label="Toggle sound">
            ♪</button
          ><button id="settings-toggle" class="icon-btn" aria-label="Settings">
            ⚙
          </button>
        </div>
      </header>
      <main id="main">
        <div class="arcade-shell">
          <div id="game-wrap">
            <div id="game"></div>
            <div id="overlay"></div>
            <div id="hud" hidden></div>
            <div id="touch-controls" hidden></div>
            <div id="rotate-hint">
              ↻ Best played in landscape
              <button aria-label="Dismiss orientation hint">×</button>
            </div>
          </div>
        </div>
        <div class="below-game">
          <span
            ><kbd>↵</kbd> SELECT <kbd>ESC</kbd> BACK / PAUSE
            <kbd>WASD</kbd> MOVE</span
          ><span>KEYBOARD <i>+</i> TOUCH <i>+</i> GAMEPAD</span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
